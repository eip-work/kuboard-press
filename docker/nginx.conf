server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # --- v3 老站路径：301 永久重定向到 v3.kuboard.cn ---
    # 原网站（Kuboard v3 文档）挂载到 v3.kuboard.cn 后，
    # 这里把 v3 时代的 4 类老路径整体交给 v3.kuboard.cn 接管，
    # 新站（press-v4）不再承接这部分内容。
    location ^~ /learning/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /install/faq/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /install/v3/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /guide/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }

    # --- v4 老路径兼容：rewrite 到 press-v4 内部路径 ---
    # 旧版本产品代码（前端页面 / OpenAPI externalDocs / 配置默认 footer）
    # 中硬编码的 https://kuboard.cn/v4/... 链接，在 DNS 切到本 press-v4
    # 后仍要能解析到对应页面。VitePress cleanUrls 默认输出 *.html 文件，
    # try_files 已能兜底大多数情况；这里补几条显式 rewrite 让根级入口
    # 与侧栏高亮路径与产品代码中的预期完全一致。
    # 注意：中文文档已统一迁移到 /zh/ 前缀下（与 /en/ 对称），故 v4 老路径
    # 的 rewrite 目标均为 /zh/...；/guide/ 与 /install/ 等无语言前缀的路径
    # 仍按 v3 老站处理（见上方 location ^~ 规则）。
    rewrite ^/v4/install/?$              /zh/install/             permanent;
    rewrite ^/v4/install/quickstart/?$   /zh/install/quickstart   permanent;
    rewrite ^/v4/install/quickstart\.html$ /zh/install/quickstart.html permanent;
    rewrite ^/v4/change-log/?$           /zh/changelog/           permanent;
    rewrite ^/v4/change-log/v4\.x/?$     /zh/changelog/v4.x       permanent;
    rewrite ^/v4/change-log/v4\.x\.html$ /zh/changelog/v4.x.html  permanent;
    rewrite ^/v4/mcp/?$                  /zh/mcp/                 permanent;
    rewrite ^/v4/mcp/?index\.html$       /zh/mcp/                 permanent;
    rewrite ^/v4/reference/?$            /zh/reference/           permanent;
    rewrite ^/v4/reference/reverse-proxy/?$ /zh/install/reverse-proxy permanent;
    rewrite ^/v4/reference/reverse-proxy\.html$ /zh/install/reverse-proxy permanent;
    # Phase 1 收尾：/reference/reverse-proxy 内容已并入 /install/reverse-proxy；
    # 这里兼容直接访问老路径（无 v4/ 前缀）的请求，永久重定向到新位置。
    # 注意：/reference/ 无语言前缀的路径属于 v3 老站，rewrite 目标按 v4 中文
    # 文档位置处理（老路径本身未被子网 location ^~ 覆盖时才能命中）。
    rewrite ^/reference/reverse-proxy/?$ /zh/install/reverse-proxy permanent;
    rewrite ^/reference/reverse-proxy\.html$ /zh/install/reverse-proxy permanent;
    rewrite ^/en/reference/reverse-proxy/?$ /en/install/reverse-proxy permanent;
    rewrite ^/en/reference/reverse-proxy\.html$ /en/install/reverse-proxy permanent;
    rewrite ^/v4/reference/kuboard-env/?$ /zh/reference/kuboard-env permanent;
    rewrite ^/v4/reference/kuboard-env\.html$ /zh/reference/kuboard-env.html permanent;
    rewrite ^/v4/reference/trace/?$      /zh/reference/kuboard-env#排障 permanent;
    rewrite ^/v4/reference/trace\.html$  /zh/reference/kuboard-env#排障 permanent;
    # Phase R.7：/reference/port-mapping 与 /reference/trace 页面已删除，
    # 内容分别并入 /install/quickstart#端口说明 与 /reference/kuboard-env#排障，
    # 老路径 301 到新位置（v4 前缀路径经上面 rewrite 后同样落到这两条规则）。
    rewrite ^/reference/port-mapping/?$ /zh/install/quickstart#端口说明 permanent;
    rewrite ^/en/reference/port-mapping/?$ /en/install/quickstart#端口说明 permanent;
    rewrite ^/reference/trace/?$ /zh/reference/kuboard-env#排障 permanent;
    rewrite ^/en/reference/trace/?$ /en/reference/kuboard-env#排障 permanent;
    # Webhook 顶层目录已合并到 用户/Webhook 外部用户库（入站认证）页；
    # 老 /v4/webhook/* 路径 301 到该页。
    rewrite ^/v4/webhook/?$              /zh/user/webhook-users  permanent;
    rewrite ^/v4/webhook/user/?$         /zh/user/webhook-users  permanent;
    rewrite ^/v4/webhook/user\.html$     /zh/user/webhook-users.html permanent;
    rewrite ^/v4/support/?$              /zh/support/             permanent;
    rewrite ^/v4/?$                      /zh/                     permanent;
    # 站点根 / 与无语言前缀的 v4 路径统一落到中文文档 /zh/
    rewrite ^/?$                         /zh/                     permanent;

    # --- VitePress (cleanUrls) 默认路由 ---
    # /install -> install/index.html, /install/quickstart -> quickstart.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # hashed static assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}