server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;

    # --- v3 老站路径：301 永久重定向到 v3.kuboard.cn ---
    # 原网站（Kuboard v3 文档）挂载到 v3.kuboard.cn 后，
    # 这里把 v3 时代的 4 类老路径整体交给 v3.kuboard.cn 接管，
    # 新站（press-v4）不再承接这部分内容。
    location ^~ /learning/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /install/faq/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /install/v3/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }
    location ^~ /guide/ {
        return 301 https://v3.kuboard.cn$request_uri;
    }

    # --- v4 老路径兼容：rewrite 到 press-v4 内部路径 ---
    # 旧版本产品代码（前端页面 / OpenAPI externalDocs / 配置默认 footer）
    # 中硬编码的 https://kuboard.cn/v4/... 链接，在 DNS 切到本 press-v4
    # 后仍要能解析到对应页面。VitePress cleanUrls 默认输出 *.html 文件，
    # try_files 已能兜底大多数情况；这里补几条显式 rewrite 让根级入口
    # 与侧栏高亮路径与产品代码中的预期完全一致。
    rewrite ^/v4/install/?$              /install/             permanent;
    rewrite ^/v4/install/quickstart/?$   /install/quickstart   permanent;
    rewrite ^/v4/install/quickstart\.html$ /install/quickstart.html permanent;
    rewrite ^/v4/change-log/?$           /changelog/           permanent;
    rewrite ^/v4/change-log/v4\.x/?$     /changelog/v4.x       permanent;
    rewrite ^/v4/change-log/v4\.x\.html$ /changelog/v4.x.html  permanent;
    rewrite ^/v4/mcp/?$                  /mcp/                 permanent;
    rewrite ^/v4/mcp/?index\.html$       /mcp/                 permanent;
    rewrite ^/v4/reference/?$            /reference/           permanent;
    rewrite ^/v4/reference/reverse-proxy/?$ /install/reverse-proxy permanent;
    rewrite ^/v4/reference/reverse-proxy\.html$ /install/reverse-proxy permanent;
    # Phase 1 收尾：/reference/reverse-proxy 内容已并入 /install/reverse-proxy；
    # 这里兼容直接访问老路径（无 v4/ 前缀）的请求，永久重定向到新位置。
    rewrite ^/reference/reverse-proxy/?$ /install/reverse-proxy permanent;
    rewrite ^/reference/reverse-proxy\.html$ /install/reverse-proxy permanent;
    rewrite ^/en/reference/reverse-proxy/?$ /en/install/reverse-proxy permanent;
    rewrite ^/en/reference/reverse-proxy\.html$ /en/install/reverse-proxy permanent;
    rewrite ^/v4/reference/kuboard-env/?$ /reference/kuboard-env permanent;
    rewrite ^/v4/reference/kuboard-env\.html$ /reference/kuboard-env.html permanent;
    rewrite ^/v4/reference/trace/?$      /reference/trace      permanent;
    rewrite ^/v4/reference/trace\.html$  /reference/trace.html permanent;
    rewrite ^/v4/webhook/?$              /webhook/             permanent;
    rewrite ^/v4/webhook/user/?$         /webhook/user         permanent;
    rewrite ^/v4/webhook/user\.html$     /webhook/user.html    permanent;
    rewrite ^/v4/support/?$              /support/             permanent;
    rewrite ^/v4/?$                      /                     permanent;

    # --- VitePress (cleanUrls) 默认路由 ---
    # /install -> install/index.html, /install/quickstart -> quickstart.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # hashed static assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}