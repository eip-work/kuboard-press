<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 680" role="img" aria-label="Kuboard 概念架构" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>Kuboard 概念架构</title>
  <desc>用户通过 UI、AI Agent 通过 MCP、CI 工具通过 OpenAPI 访问 Kuboard，由 Kuboard 统一管理多个 Kubernetes 集群</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="60%" stop-color="#DCE5FF"/>
      <stop offset="100%" stop-color="#C7D3FF"/>
    </linearGradient>
    <linearGradient id="panelHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3457D5"/>
      <stop offset="100%" stop-color="#5B7BFF"/>
    </linearGradient>
    <linearGradient id="panelBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="clusterA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3457D5"/>
      <stop offset="100%" stop-color="#6A8AFF"/>
    </linearGradient>
    <linearGradient id="clusterB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3FB8"/>
      <stop offset="100%" stop-color="#3457D5"/>
    </linearGradient>
    <linearGradient id="clusterC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B7BFF"/>
      <stop offset="100%" stop-color="#8FA8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        animate { display: none; }
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1260" height="680" rx="24" fill="url(#bg)"/>

  <!-- 装饰虚线 -->
  <g opacity="0.45" stroke="#3457D5" stroke-width="1" fill="none">
    <path d="M0,90 L1260,90" stroke-dasharray="2 8"/>
    <path d="M0,590 L1260,590" stroke-dasharray="2 8"/>
    <path d="M120,0 L120,680" stroke-dasharray="2 10"/>
    <path d="M365,0 L365,680" stroke-dasharray="2 10"/>
    <path d="M1140,0 L1140,680" stroke-dasharray="2 10"/>
  </g>

  <!-- 装饰点 -->
  <g opacity="0.6" fill="#3457D5">
    <circle cx="90" cy="70" r="4"/>
    <circle cx="430" cy="110" r="4"/>
    <circle cx="60" cy="560" r="4"/>
    <circle cx="450" cy="540" r="4"/>
    <circle cx="520" cy="40" r="3"/>
    <circle cx="40" cy="320" r="3"/>
    <circle cx="490" cy="320" r="3"/>
    <circle cx="540" cy="590" r="3"/>
  </g>

  <!-- ===================== 左：访问入口（260×140，图标靠左，文字靠右） ===================== -->

  <!-- 卡片 1: User / UI -->
  <g transform="translate(60, 90)">
    <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="140" rx="18" fill="#FFFFFF" stroke="#D6DFFB" stroke-width="2"/>
    <circle cx="85" cy="70" r="32" fill="#3457D5" opacity="0.10"/>
    <g transform="translate(85, 70)" fill="#3457D5">
      <circle cx="0" cy="-6" r="9"/>
      <path d="M-15,26 Q-15,6 0,6 Q15,6 15,26 Z" opacity="0.8"/>
    </g>
    <text x="135" y="52" fill="#1E3FB8" font-size="18" font-weight="700">User</text>
    <text x="135" y="72" fill="#6B7AB0" font-size="12">用户</text>
    <g transform="translate(135, 90)">
      <rect x="0" y="0" width="36" height="20" rx="5" fill="#EEF2FF" stroke="#3457D5" stroke-width="1.5"/>
      <text x="18" y="14" text-anchor="middle" fill="#3457D5" font-size="11" font-weight="700" font-family="ui-monospace, monospace">UI</text>
    </g>
  </g>

  <!-- 卡片 2: AI Agent / MCP -->
  <g transform="translate(60, 270)">
    <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="140" rx="18" fill="#FFFFFF" stroke="#D6DFFB" stroke-width="2"/>
    <circle cx="85" cy="70" r="32" fill="#8B5CF6" opacity="0.10"/>
    <g transform="translate(85, 70)" fill="#8B5CF6">
      <line x1="0" y1="-22" x2="0" y2="-14" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-25" r="3.5"/>
      <rect x="-16" y="-14" width="32" height="26" rx="7"/>
      <circle cx="-6" cy="-4" r="3" fill="#FFFFFF"/>
      <circle cx="6" cy="-4" r="3" fill="#FFFFFF"/>
      <rect x="-4" y="4" width="8" height="2" rx="1" fill="#FFFFFF"/>
      <rect x="-8" y="12" width="16" height="8" rx="3" opacity="0.7"/>
    </g>
    <text x="135" y="52" fill="#5B21B6" font-size="18" font-weight="700">AI Agent</text>
    <text x="135" y="72" fill="#7B89B8" font-size="12">智能体</text>
    <g transform="translate(135, 90)">
      <rect x="0" y="0" width="40" height="20" rx="5" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="20" y="14" text-anchor="middle" fill="#8B5CF6" font-size="11" font-weight="700" font-family="ui-monospace, monospace">MCP</text>
    </g>
  </g>

  <!-- 卡片 3: CI/CD / OpenAPI -->
  <g transform="translate(60, 450)">
    <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
    <rect x="0" y="0" width="260" height="140" rx="18" fill="#FFFFFF" stroke="#D6DFFB" stroke-width="2"/>
    <circle cx="85" cy="70" r="32" fill="#06B6D4" opacity="0.10"/>
    <g transform="translate(85, 70)" fill="none" stroke="#06B6D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4,-14 L-12,0 L4,14"/>
      <path d="M-4,-14 L12,0 L-4,14"/>
    </g>
    <text x="135" y="52" fill="#0E7490" font-size="18" font-weight="700">CI/CD</text>
    <text x="135" y="72" fill="#4B9AAA" font-size="12">持续集成</text>
    <g transform="translate(135, 90)">
      <rect x="0" y="0" width="56" height="20" rx="5" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="28" y="14" text-anchor="middle" fill="#06B6D4" font-size="11" font-weight="700" font-family="ui-monospace, monospace">OpenAPI</text>
    </g>
  </g>

  <!-- ===================== 左 → 中 连接线 ===================== -->
  <!-- 卡片右边缘 x=320，面板左边缘 x=410（340+70） -->
  <g stroke="#3457D5" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M320,160 C 360,160 380,220 410,260" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M320,340 C 360,340 380,320 410,310" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M320,520 C 360,520 380,420 410,360" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#3457D5">
    <circle cx="320" cy="160" r="6"/>
    <circle cx="320" cy="340" r="6"/>
    <circle cx="320" cy="520" r="6"/>
  </g>

  <!-- 协议徽章 -->
  <g transform="translate(347, 200)">
    <rect x="0" y="0" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#3457D5" stroke-width="1.5"/>
    <text x="18" y="14" text-anchor="middle" fill="#3457D5" font-size="11" font-weight="700" font-family="ui-monospace, monospace">UI</text>
  </g>
  <g transform="translate(345, 315)">
    <rect x="0" y="0" width="40" height="20" rx="5" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="20" y="14" text-anchor="middle" fill="#8B5CF6" font-size="11" font-weight="700" font-family="ui-monospace, monospace">MCP</text>
  </g>
  <g transform="translate(329, 430)">
    <rect x="0" y="0" width="56" height="20" rx="5" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="28" y="14" text-anchor="middle" fill="#06B6D4" font-size="11" font-weight="700" font-family="ui-monospace, monospace">OpenAPI</text>
  </g>

  <!-- ===================== hero 原图内容（整体右移 340px） ===================== -->
  <g transform="translate(340,0)">
    <!-- Kuboard 管理面板 -->
    <g transform="translate(70,110)">
      <rect x="-12" y="-12" width="464" height="424" rx="22" fill="#3457D5" opacity="0.18" filter="url(#shadow)"/>
      <rect x="0" y="0" width="440" height="400" rx="18" fill="url(#panelBody)" stroke="#D6DFFB" stroke-width="2"/>

      <rect x="0" y="0" width="440" height="56" rx="18" fill="url(#panelHeader)"/>
      <rect x="0" y="20" width="440" height="36" fill="url(#panelHeader)"/>
      <circle cx="24" cy="28" r="6" fill="#FF6B6B"/>
      <circle cx="44" cy="28" r="6" fill="#FFD166"/>
      <circle cx="64" cy="28" r="6" fill="#06D6A0"/>
      <text x="220" y="34" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="1">Kuboard · 多集群管理</text>

      <!-- 集群行 1: prod — Healthy 左移 10px -->
      <g transform="translate(28,82)">
        <rect x="0" y="0" width="384" height="48" rx="10" fill="#EEF2FF" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="24" cy="24" r="9" fill="url(#clusterA)"/>
        <text x="42" y="22" fill="#1E3FB8" font-size="14" font-weight="700">prod-cluster</text>
        <text x="42" y="38" fill="#6B7AB0" font-size="11">生产环境 · 12 节点</text>
        <circle cx="310" cy="24" r="7" fill="#06D6A0"/>
        <text x="324" y="28" fill="#06D6A0" font-size="13" font-weight="700">Healthy</text>
      </g>

      <!-- 集群行 2: staging — Healthy 左移 10px -->
      <g transform="translate(28,142)">
        <rect x="0" y="0" width="384" height="48" rx="10" fill="#EEF2FF" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="24" cy="24" r="9" fill="url(#clusterB)"/>
        <text x="42" y="22" fill="#1E3FB8" font-size="14" font-weight="700">staging-cluster</text>
        <text x="42" y="38" fill="#6B7AB0" font-size="11">预发布 · 5 节点</text>
        <circle cx="310" cy="24" r="7" fill="#06D6A0"/>
        <text x="324" y="28" fill="#06D6A0" font-size="13" font-weight="700">Healthy</text>
      </g>

      <!-- 集群行 3: dev — Syncing 左移 10px -->
      <g transform="translate(28,202)">
        <rect x="0" y="0" width="384" height="48" rx="10" fill="#EEF2FF" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="24" cy="24" r="9" fill="url(#clusterC)"/>
        <text x="42" y="22" fill="#1E3FB8" font-size="14" font-weight="700">dev-cluster</text>
        <text x="42" y="38" fill="#6B7AB0" font-size="11">开发测试 · 3 节点</text>
        <circle cx="310" cy="24" r="7" fill="#FFD166"/>
        <text x="324" y="28" fill="#FFA500" font-size="13" font-weight="700">Syncing</text>
      </g>

      <g transform="translate(28,278)">
        <rect x="0" y="0" width="118" height="38" rx="8" fill="#3457D5"/>
        <text x="59" y="24" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">工作负载</text>
        <rect x="130" y="0" width="118" height="38" rx="8" fill="#FFFFFF" stroke="#3457D5" stroke-width="1.5"/>
        <text x="189" y="24" text-anchor="middle" fill="#3457D5" font-size="13" font-weight="700">命名空间</text>
        <rect x="260" y="0" width="124" height="38" rx="8" fill="#FFFFFF" stroke="#D6DFFB" stroke-width="1.5"/>
        <text x="322" y="24" text-anchor="middle" fill="#3457D5" font-size="13" font-weight="700">存储卷 / 配置</text>
      </g>

      <g transform="translate(28,338)">
        <rect x="0" y="0" width="384" height="40" rx="10" fill="#F4F7FF" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="20" cy="20" r="5" fill="#3457D5"/>
        <text x="34" y="25" fill="#3457D5" font-size="12" font-weight="600">MCP 接入</text>
        <line x1="100" y1="20" x2="130" y2="20" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="146" cy="20" r="5" fill="#5B7BFF"/>
        <text x="160" y="25" fill="#3457D5" font-size="12" font-weight="600">审计日志</text>
        <line x1="234" y1="20" x2="264" y2="20" stroke="#D6DFFB" stroke-width="1"/>
        <circle cx="280" cy="20" r="5" fill="#06D6A0"/>
        <text x="294" y="25" fill="#3457D5" font-size="12" font-weight="600">MFA</text>
      </g>
    </g>

    <!-- 集群卡片 -->
    <g transform="translate(600,90)">
      <g transform="translate(0,0)">
        <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
        <rect x="0" y="0" width="260" height="140" rx="18" fill="url(#clusterA)"/>
        <circle cx="220" cy="20" r="60" fill="url(#glow)"/>
        <g transform="translate(130,70)">
          <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="11" fill="#FFFFFF"/>
          <line x1="0" y1="0" x2="0" y2="-32" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="-15" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="15" stroke="#FFFFFF" stroke-width="2"/>
        </g>
        <text x="130" y="128" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">prod-cluster</text>
      </g>

      <g transform="translate(0,180)">
        <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
        <rect x="0" y="0" width="260" height="140" rx="18" fill="url(#clusterB)"/>
        <circle cx="220" cy="20" r="60" fill="url(#glow)"/>
        <g transform="translate(130,70)">
          <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="11" fill="#FFFFFF"/>
          <line x1="0" y1="0" x2="0" y2="-32" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="-15" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="15" stroke="#FFFFFF" stroke-width="2"/>
        </g>
        <text x="130" y="128" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">staging-cluster</text>
      </g>

      <g transform="translate(0,360)">
        <rect x="-10" y="-10" width="280" height="160" rx="22" fill="#3457D5" opacity="0.15" filter="url(#shadow)"/>
        <rect x="0" y="0" width="260" height="140" rx="18" fill="url(#clusterC)"/>
        <circle cx="220" cy="20" r="60" fill="url(#glow)"/>
        <g transform="translate(130,70)">
          <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="11" fill="#FFFFFF"/>
          <line x1="0" y1="0" x2="0" y2="-32" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="-15" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="0" y1="0" x2="26" y2="15" stroke="#FFFFFF" stroke-width="2"/>
        </g>
        <text x="130" y="128" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">dev-cluster</text>
      </g>
    </g>

    <!-- 面板 → 集群 连接线（带流光动画） -->
    <g stroke="#3457D5" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5">
      <path d="M520,260 C 560,200 580,180 600,170" stroke-dasharray="6 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M520,310 C 560,330 580,340 600,350" stroke-dasharray="6 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M520,360 C 560,450 580,500 600,530" stroke-dasharray="6 7">
        <animate attributeName="stroke-dashoffset" from="0" to="-26" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#3457D5">
      <circle cx="520" cy="260" r="6"/>
      <circle cx="520" cy="310" r="6"/>
      <circle cx="520" cy="360" r="6"/>
    </g>
  </g>
</svg>
