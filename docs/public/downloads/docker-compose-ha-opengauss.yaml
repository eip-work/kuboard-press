      cluster-node-timeout 5000
      appendonly yes
      user default off
      user kuboard on >Kuboard123 ~* &* +@all
      masteruser kuboard
      masterauth Kuboard123

services:
  db:
    image: enmotech/opengauss:5.0.1
    privileged: true
    user: root
    command: ["bash", "-c", "bash /opt/opengauss-init.sh && exec entrypoint.sh gaussdb"]
    environment:
      GS_PASSWORD: Kuboard@123
      TZ: Asia/Shanghai
    volumes:
      - ./docker-compose-ha-postgres-data/kuboard-opengauss:/var/lib/opengauss:Z
      - ./opengauss-init.sh:/opt/opengauss-init.sh:ro
    configs:
      - source: create_db_sql
        target: /docker-entrypoint-initdb.d/create_db.sql
        mode: 0777
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "gsql -U kuboard -W Kuboard@123 -d kuboard -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-1:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_1_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-1:/data
    command: redis-server /redis/redis.conf
    ports:
      - 7001:7001
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-2:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_2_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-2:/data
    command: redis-server /redis/redis.conf
    ports:
      - 17002:7002
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-3:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_3_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-3:/data
    command: redis-server /redis/redis.conf
    ports:
      - 7003:7003
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-4:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_4_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-4:/data
    command: redis-server /redis/redis.conf
    ports:
      - 7004:7004
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-5:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_5_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-5:/data
    command: redis-server /redis/redis.conf
    ports:
      - 7005:7005
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-node-6:
    image: 192.168.3.109:5001/redis:7.2-alpine
    configs:
      - source: redis_node_6_conf
        target: /redis/redis.conf
    volumes:
      - ./docker-compose-ha-postgres-data/redis-node-6:/data
    command: redis-server /redis/redis.conf
    ports:
      - 7006:7006
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "--user", "kuboard", "--pass", "Kuboard123", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      kuboard_v4_ha_opengauss:

  redis-cluster-creator:
    image: 192.168.3.109:5001/redis:7.2-alpine
    command: /bin/sh -c "sleep 10 && redis-cli -p 7001 --user kuboard --pass Kuboard123 --no-auth-warning --cluster check redis-node-1:7001 >/dev/null 2>&1 && echo 'Redis cluster already exists, skipping creation' && exit 0; redis-cli -p 7001 --user kuboard --pass Kuboard123 --no-auth-warning --cluster create redis-node-1:7001 redis-node-2:7002 redis-node-3:7003 redis-node-4:7004 redis-node-5:7005 redis-node-6:7006 --cluster-replicas 1 --cluster-yes; redis-cli -p 7001 --user kuboard --pass Kuboard123 --no-auth-warning --cluster check redis-node-1:7001 >/dev/null 2>&1"
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    networks:
      kuboard_v4_ha_opengauss:

  kuboard-1:
    image: ${KUBOARD_IMAGE_REPO}:${KUBOARD_VERSION}
    environment:
      - DB_DRIVER=org.opengauss.Driver
      - DB_URL=jdbc:opengauss://db:5432/kuboard?serverTimezone=Asia/Shanghai
      - DB_USERNAME=kuboard
      - DB_PASSWORD=Kuboard@123
      - KUBOARD_CACHE_PROVIDER=redis
      - KUBOARD_CACHE_REDIS_MODE=cluster
      - KUBOARD_CACHE_REDIS_NODES=redis-node-1:7001,redis-node-2:7002,redis-node-3:7003,redis-node-4:7004,redis-node-5:7005,redis-node-6:7006
      - KUBOARD_CACHE_REDIS_USERNAME=kuboard
      - KUBOARD_CACHE_REDIS_PASSWORD=Kuboard123
    volumes:
      - ./docker-compose-ha-postgres-data/kuboard-1-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cluster-creator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      kuboard_v4_ha_opengauss:

  kuboard-2:
    image: ${KUBOARD_IMAGE_REPO}:${KUBOARD_VERSION}
    environment:
      - DB_DRIVER=org.opengauss.Driver
      - DB_URL=jdbc:opengauss://db:5432/kuboard?serverTimezone=Asia/Shanghai
      - DB_USERNAME=kuboard
      - DB_PASSWORD=Kuboard@123
      - KUBOARD_CACHE_PROVIDER=redis
      - KUBOARD_CACHE_REDIS_MODE=cluster
      - KUBOARD_CACHE_REDIS_NODES=redis-node-1:7001,redis-node-2:7002,redis-node-3:7003,redis-node-4:7004,redis-node-5:7005,redis-node-6:7006
      - KUBOARD_CACHE_REDIS_USERNAME=kuboard
      - KUBOARD_CACHE_REDIS_PASSWORD=Kuboard123
    volumes:
      - ./docker-compose-ha-postgres-data/kuboard-2-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cluster-creator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      kuboard_v4_ha_opengauss:

  nginx:
    image: 192.168.3.109:5001/nginx:1.25-alpine
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "9001:80"
    depends_on:
      - kuboard-1
      - kuboard-2
    networks:
      kuboard_v4_ha_opengauss:

networks:
  kuboard_v4_ha_opengauss:
    driver: bridge
